<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library</title>
<link rel="stylesheet" href="style.css">
</head>
<body onload="initBooksPage()">

<nav class="navbar">
<h1>📚 Library</h1>
<div class="navbar-actions">
  <span id="userGreeting"></span>
  <a href="index.html">Home</a>
  <button type="button" class="toggle" onclick="logout()">Logout</button>
</div>
</nav>

<section class="library-container">

<div class="card">
<h2>Add / Edit Book</h2>
<input id="bookTitle" placeholder="Book Title">
<input id="bookIsbn" placeholder="ISBN (optional)">
<input id="bookYear" type="number" placeholder="Publication Year (optional)" min="1000" max="2100">
<select id="bookAuthor">
  <option value="">Select Author</option>
</select>
<select id="bookCategory">
  <option value="">Select Category</option>
</select>
<button type="button" onclick="addBook()">Save Book</button>
</div>

<div class="card">
<h2>Search</h2>
<input id="searchInput" placeholder="Search by title, author, category, ISBN..." onkeyup="searchBooks()">
</div>

<div id="bookGrid" class="book-grid"></div>

</section>

<div id="toast" class="toast"></div>

<script src="script.js"></script>
</body>
</html>
